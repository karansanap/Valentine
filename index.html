<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Valentine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
  }

  h1 {
    color: #b30000;
    font-size: 28px;
    margin-bottom: 20px;
  }

  button {
    padding: 12px 24px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin: 10px;
  }

  #yes {
    background: #d10000;
    color: white;
  }

  #no {
    background: white;
    color: #d10000;
    position: absolute;
  }

  #message {
    font-size: 20px;
    color: white;
    margin-top: 20px;
    line-height: 1.5;
  }

  .heart {
    position: absolute;
    font-size: 24px;
    animation: float 5s linear infinite;
    color: rgba(255, 0, 0, 0.6);
  }

  @keyframes float {
    0% { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
  }

  #musicBtn {
  position: fixed;
  top: 20px;       /* top instead of bottom */
  left: 20px;      /* left side */
  z-index: 9999;   /* stays above everything */
  font-size: 14px;
  background: rgba(255,255,255,0.9);
  color: #d10000;
  padding: 6px 10px;
  border-radius: 8px;
}

<body>

<div id="content">
  <img src="photo.jpg" alt="Us together" style="width:80%; max-width:300px; border-radius:15px; margin-bottom:20px;">
  <h1>Pankuu, Will you be my Valentine? ❤️</h1>
  <button id="yes" onclick="sayYes()">Yes 💖</button>
  <button id="no" onmouseover="moveNo()">No 😜</button>
  <div id="message"></div>
</div>

<audio id="bgMusic" loop>
  <source src="my-song.mp3" type="audio/mpeg">
</audio>

<script>
  function sayYes() {
    document.getElementById("content").innerHTML = `
      <h1>Yayyy!! 💕</h1>
      <div id="message">
        Thank you for being you 💖<br>
        For the smiles, the love, and everything in between.<br><br>
        Happy Valentine’s Day, Pankti 🌹<br><br>
        — Karan ❤️
      </div>
    `;
  }

  function moveNo() {
    const noBtn = document.getElementById("no");
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }

  setInterval(createHeart, 300);

  const music = document.getElementById("bgMusic");
  let playing = false;

  function toggleMusic() {
    if (!playing) {
      music.play();
      document.getElementById("musicBtn").innerText = "⏸ Pause music";
      playing = true;
    } else {
      music.pause();
      document.getElementById("musicBtn").innerText = "🎶 Play music";
      playing = false;
    }
  }
</script>

</body>
</html>
